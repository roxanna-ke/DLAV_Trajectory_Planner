data:
  train_dir: ./train
  val_dir: ./val
  test_dir: ./test_public
  output_dir: outputs/milestone1_command
  image_height: 224
  image_width: 336
  submission_name: submission.csv

model:
  pretrained_backbone: true
  image_feature_dim: 256
  history_hidden_dim: 128
  command_feature_dim: 64
  history_layers: 2
  dropout: 0.1
  future_steps: 60
  use_command: true
  fusion: command_film_concat
  decoder: autoregressive_gru
  use_depth_head: false
  use_segmentation_head: false

training:
  batch_size: 32
  num_workers: 2
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
