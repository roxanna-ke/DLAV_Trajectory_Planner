data:
  train_dir: ./train
  real_dir: ./val_real
  test_dir: ./test_public_real
  output_dir: outputs/final_sim2real
  real_val_fraction: 0.5
  real_oversample: 1
  use_adain: true
  style_stat_samples: 200
  style_alpha: 0.5
  image_height: 224
  image_width: 336
  submission_name: submission.csv

model:
  pretrained_backbone: true
  image_feature_dim: 256
  history_hidden_dim: 128
  history_layers: 2
  dropout: 0.1
  future_steps: 60
  use_command: false
  fusion: history_conditioned_spatial_attention
  decoder: autoregressive_gru
  use_depth_head: false
  use_segmentation_head: false

training:
  batch_size: 32
  num_workers: 2
  epochs: 80
  lr: 0.001
  weight_decay: 0.0001
  heading_weight: 0.1
  ade_weight: 1.0
  fde_weight: 1.0
  time_weight_start: 1.0
  time_weight_end: 2.0
  gradient_clip: 5.0
  seed: 42
